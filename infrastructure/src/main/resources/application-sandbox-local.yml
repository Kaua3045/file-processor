application:
  eventbus: kafka
  otel:
    memory-exporter: false
  name: file-processor
  environment: ${DEPLOYMENT_ENVIRONMENT_NAME:dev}
  instance: file-processor-01

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

kafka:
  bootstrap-servers: ${KAFKA_HOST}

server:
  undertow:
    threads:
      worker: 10
      io: 2

spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: root
    password: 123456
    url: jdbc:h2:mem:template;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE # change this to your database type, postgresql, mysql or other
  test:
    database:
      replace: none
  h2:
    console:
      enabled: true
      path: /h2
  #  datasource: # change this configurations to your database
  #    url: jdbc:postgresql://localhost:5434/template
  #    username: postgres
  #    password: 123456
  jpa:
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    redis:
      enabled: false

opentelemetry:
  metrics:
    #    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT} # For Production
    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4317/v1/metrics}