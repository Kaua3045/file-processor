application:
  eventbus: kafka
  otel:
    memory-exporter: false
  name: file-processor
  environment: ${DEPLOYMENT_ENVIRONMENT_NAME:dev}
  instance: file-processor-01

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

kafka:
  bootstrap-servers: ${KAFKA_BROKERS}

server:
  undertow:
    threads:
      worker: 10
      io: 2

spring:
  kafka:
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
  datasource: # change this configurations to your database
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        sslmode: require
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    redis:
      enabled: false

opentelemetry:
  metrics:
    #    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT} # For Production
    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4317/v1/metrics}