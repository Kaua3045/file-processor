application:
  eventbus: kafka
  otel:
    memory-exporter: true
  name: file-processor
  environment: ${DEPLOYMENT_ENVIRONMENT_NAME:dev}
  instance: file-processor-01

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

kafka:
  bootstrap-servers: ${KAFKA_HOST}

server:
  undertow:
    threads:
      worker: 10
      io: 2

spring:
    datasource: # change this configurations to your database
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    flyway:
      enabled: true
      locations: classpath:db/migration

management:
  health:
    redis:
      enabled: false

opentelemetry:
  metrics:
    #    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT} # For Production
    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4317/v1/metrics}